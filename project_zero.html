<!--
  Problem: Choice menu A/B/C with keyboard keys
  Console menu with three choices A, B, C moved with 'u' (up) and 'd' (down)
  and validated with 'e'; selecting displays the chosen option.
  Context: University tutorial / lab exercise (TD / TP)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choice menu A/B/C with keyboard keys</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #333; }
        .output { background: #f5f5f5; padding: 1rem; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Choice menu A/B/C with keyboard keys</h1>
    <p>Console menu with three choices A, B, C moved with 'u' (up) and 'd' (down) and validated with 'e'; selecting displays the chosen option.</p>
    <div class="output" id="output"></div>
    <script>
        document.getElementById('output').textContent = 'Choice menu A/B/C with keyboard keys';
    </script>
</body>
</html>
