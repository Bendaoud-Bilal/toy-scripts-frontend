<!--
  Problem: Numeric value versus character representation
  For every value from 0 to 122 print the number and the character it
  represents.
  Context: University tutorial / lab exercise (TD / TP)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeric value versus character representation</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #333; }
        .output { background: #f5f5f5; padding: 1rem; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Numeric value versus character representation</h1>
    <p>For every value from 0 to 122 print the number and the character it represents.</p>
    <div class="output" id="output"></div>
    <script>
        document.getElementById('output').textContent = 'Numeric value versus character representation';
    </script>
</body>
</html>
