<!--
  Problem: Return to the menu with Esc
  Show a procedure screen (the alphabet) inside a menu action and go back to
  the main menu when Esc is pressed.
  Context: University tutorial / lab exercise (TD / TP)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return to the menu with Esc</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #333; }
        .output { background: #f5f5f5; padding: 1rem; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Return to the menu with Esc</h1>
    <p>Show a procedure screen (the alphabet) inside a menu action and go back to the main menu when Esc is pressed.</p>
    <div class="output" id="output"></div>
    <script>
        document.getElementById('output').textContent = 'Return to the menu with Esc';
    </script>
</body>
</html>
