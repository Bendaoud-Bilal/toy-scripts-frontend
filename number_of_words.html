<!--
  Problem: Count the words of a paragraph
  Read a paragraph and count its words by counting the spaces; loop until the
  user presses 'r'.
  Context: University tutorial / lab exercise (TD / TP)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count the words of a paragraph</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #333; }
        .output { background: #f5f5f5; padding: 1rem; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Count the words of a paragraph</h1>
    <p>Read a paragraph and count its words by counting the spaces; loop until the user presses 'r'.</p>
    <div class="output" id="output"></div>
    <script>
        document.getElementById('output').textContent = 'Count the words of a paragraph';
    </script>
</body>
</html>
