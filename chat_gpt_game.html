<!--
  Problem: SDL2 window with fade-in / fade-out
  Small SDL2 experiment: open a window and render a fade-in and fade-out
  effect by changing the alpha of a black overlay every frame.
  Context: University tutorial / lab exercise (TD / TP)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDL2 window with fade-in / fade-out</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #333; }
        .output { background: #f5f5f5; padding: 1rem; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>SDL2 window with fade-in / fade-out</h1>
    <p>Small SDL2 experiment: open a window and render a fade-in and fade-out effect by changing the alpha of a black overlay every frame.</p>
    <div class="output" id="output"></div>
    <script>
        document.getElementById('output').textContent = 'SDL2 window with fade-in / fade-out';
    </script>
</body>
</html>
